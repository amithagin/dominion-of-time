  :root {
    --ink: #0B0A12;
    --deep: #161231;
    --gold: #D3A95C;
    --gold-bright: #F0D08A;
    --ivory: #EDE7D8;
    --violet: #6E5FA3;
    --whisper: rgba(237, 231, 216, 0.55);
    --hairline: rgba(211, 169, 92, 0.22);
    --drama: "Anton", "Impact", "Haettenschweiler", "Arial Narrow", sans-serif;
    --display: "Futura", "Avenir Next", "Trebuchet MS", sans-serif;
    --caps: "Futura", "Avenir Next", "Trebuchet MS", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--ink);
    color: var(--ivory);
    font-family: var(--display);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ambient stage ---------- */

  .stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(120vmax 90vmax at 50% 42%, var(--deep) 0%, #0a0817 46%, #060510 100%);
  }

  #dust {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .clockring {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 118vmin;
    height: 118vmin;
    transform: translate(-50%, -50%);
    opacity: 0.28;
    pointer-events: none;
  }
  .clockring .ring-a { animation: spin 240s linear infinite; transform-origin: 50% 50%; }
  .clockring .ring-b { animation: spin 340s linear infinite reverse; transform-origin: 50% 50%; }
  .clockring .hand   {
    transform-origin: 50% 50%;
    /* stepped like a real escapement — JS advances it 6° per tick */
    transition: transform 0.14s cubic-bezier(0.3, 2.0, 0.5, 1);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(closest-side at 50% 50%, transparent 62%, rgba(4, 3, 10, 0.85) 100%);
  }

  /* ---------- screens ---------- */

  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 4vmin;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.965);
    filter: blur(14px);
    transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
    filter: blur(0);
  }

  .eyebrow {
    font-family: var(--caps);
    font-size: clamp(0.7rem, 1.4vmin, 1rem);
    font-weight: 500;
    letter-spacing: 0.52em;
    text-indent: 0.52em; /* recenters tracked caps */
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 1.4em;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    display: block;
    width: 4.5em;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--hairline));
  }
  .eyebrow::after { background: linear-gradient(90deg, var(--hairline), transparent); }

  /* ---------- screen 1 : title ---------- */

  .title-the, .title-app {
    font-family: var(--caps);
    font-weight: 400;
    letter-spacing: 0.9em;
    text-indent: 0.9em;
    text-transform: uppercase;
    font-size: clamp(0.9rem, 2.2vmin, 1.5rem);
    color: var(--whisper);
  }

  .title-main {
    font-family: var(--drama);
    font-size: clamp(3rem, 13vmin, 10rem);
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.02;
    text-align: center;
    text-wrap: balance;
    letter-spacing: 0.035em;
    background: linear-gradient(100deg,
      #8a6d3a 0%, var(--gold) 28%, var(--gold-bright) 46%,
      #fff3cf 50%, var(--gold-bright) 54%, var(--gold) 72%, #8a6d3a 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 7s ease-in-out infinite;
    /* padding keeps the italic descenders inside the painted (clipped) box */
    padding: 0.05em 0.12em 0.16em;
    margin: calc(2.2vmin - 0.05em) 0 calc(2.2vmin - 0.16em);
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 0; }
    50% { background-position: 100% 0; }
  }

  #screen-title .eyebrow {
    margin-bottom: 5vmin;
    font-size: clamp(1.05rem, 2.7vmin, 2rem);
  }

  .crest {
    width: clamp(150px, 30vmin, 300px);
    margin-bottom: 3vmin;
    filter: drop-shadow(0 0 22px rgba(96, 150, 255, 0.4));
    user-select: none;
    pointer-events: none;
  }

  .btn {
    margin-top: 7vmin;
    font-family: var(--caps);
    font-size: clamp(0.85rem, 1.6vmin, 1.1rem);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-transform: uppercase;
    color: var(--gold-bright);
    background: transparent;
    border: 1px solid var(--gold);
    padding: 1.35em 3.2em;
    cursor: pointer;
    position: relative;
    transition: color 0.45s ease, background-color 0.45s ease, box-shadow 0.45s ease;
  }
  .btn:hover, .btn:focus-visible {
    color: var(--ink);
    background: var(--gold);
    box-shadow: 0 0 42px rgba(211, 169, 92, 0.45);
    outline: none;
  }
  .btn::before, .btn::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1px solid var(--gold);
    transition: inherit;
  }
  .btn::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
  .btn::after  { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

  /* entrance choreography for title screen */
  #screen-title.active .crest       { animation: rise 1.2s 0.05s ease both; }
  #screen-title.active .eyebrow     { animation: rise 1.2s 0.15s ease both; }
  #screen-title.active .title-the   { animation: rise 1.2s 0.45s ease both; }
  #screen-title.active .title-main  { animation: rise 1.4s 0.65s ease both, shimmer 7s ease-in-out infinite; }
  #screen-title.active .title-app   { animation: rise 1.2s 0.95s ease both; }
  #screen-title.active .btn         { animation: rise 1.2s 1.4s ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(2.4vmin); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #screen-title.active .title-the,
  #screen-title.active .title-app { animation-fill-mode: both; }

  /* ---------- screen 2 : question ---------- */

  .question {
    font-family: var(--drama);
    font-size: clamp(1.7rem, 5vmin, 3.6rem);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 1.12;
    text-align: center;
    text-wrap: balance;
    max-width: 26ch;
    margin: 3.5vmin 0 5.5vmin;
  }

  .answers {
    list-style: none;
    width: min(680px, 92vw);
    border-top: 1px solid var(--hairline);
  }

  .answer {
    border-bottom: 1px solid var(--hairline);
  }

  .answer button {
    display: grid;
    grid-template-columns: 3.2em 1fr;
    align-items: baseline;
    gap: 0.4em;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    color: var(--ivory);
    font-family: var(--display);
    font-size: clamp(1rem, 2.4vmin, 1.5rem);
    padding: 1.05em 0.9em;
    cursor: pointer;
    position: relative;
    transition: background-color 0.4s ease, transform 0.4s ease, opacity 0.4s ease;
  }
  .answer button:hover, .answer button:focus-visible {
    background: rgba(211, 169, 92, 0.07);
    transform: translateX(0.5em);
    outline: none;
  }
  .answer .numeral {
    font-family: var(--drama);
    color: var(--gold);
    font-size: 1.05em;
    letter-spacing: 0.05em;
  }
  .answer .text { position: relative; }
  .answer .text::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0.58em;
    height: 1px;
    width: 0;
    background: var(--gold);
    transition: width 0.6s ease;
  }

  .answer.wrong button {
    opacity: 0.38;
    cursor: default;
    transform: none;
    background: transparent;
  }
  .answer.wrong .text::after { width: 100%; }
  .answer.shake button { animation: shake 0.5s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }

  .answer .verdict {
    display: block;
    grid-column: 2;
    font-style: italic;
    font-size: 0.72em;
    color: var(--gold);
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.6s ease, opacity 0.6s ease, margin 0.6s ease;
  }
  .answer.wrong .verdict {
    max-height: 3em;
    opacity: 0.9;
    margin-top: 0.5em;
  }

  .answer.chosen button {
    background: rgba(211, 169, 92, 0.16);
    box-shadow: 0 0 55px rgba(211, 169, 92, 0.25) inset;
  }

  /* question enters first; answers are revealed one by one by JS, in sync with the voice */
  #screen-question.active .eyebrow  { animation: rise 1s 0.1s ease both; }
  #screen-question.active .question { animation: rise 1s 0.3s ease both; }
  .answer {
    opacity: 0;
    transform: translateY(2.4vmin);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .answer:not(.revealed) button { pointer-events: none; }
  .answer.revealed { opacity: 1; transform: none; }

  /* ---------- mirror flash ---------- */

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(115deg,
      transparent 30%, rgba(240, 208, 138, 0.55) 48%,
      rgba(255, 248, 226, 0.95) 50%, rgba(240, 208, 138, 0.55) 52%, transparent 70%);
    background-size: 300% 100%;
    background-position: 120% 0;
    opacity: 0;
  }
  .flash.go { animation: sweep 1.1s ease-in-out both; }
  @keyframes sweep {
    0%   { opacity: 0; background-position: 130% 0; }
    25%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; background-position: -30% 0; }
  }

  /* ---------- screen 3 : reward ---------- */

  #screen-reward { justify-content: flex-start; padding-top: 7vmin; }

  .reward-title {
    font-family: var(--drama);
    font-size: clamp(2.6rem, 9vmin, 7rem);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.035em;
    text-align: center;
    background: linear-gradient(100deg,
      #8a6d3a 0%, var(--gold) 30%, #fff3cf 50%, var(--gold) 70%, #8a6d3a 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 7s ease-in-out infinite;
    padding: 0.05em 0.12em 0.16em;
    margin: calc(2.2vmin - 0.05em) 0 calc(0.8vmin - 0.16em);
  }
  .reward-caption {
    font-style: italic;
    font-size: clamp(1rem, 2.3vmin, 1.5rem);
    color: var(--whisper);
  }

  .altar {
    position: relative;
    width: min(880px, 94vw);
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .joint {
    width: min(72vmin, 620px);
    transform: rotate(-14deg);
    filter: drop-shadow(0 18px 45px rgba(0, 0, 0, 0.55));
  }
  .joint .ember-core { animation: emberpulse 2.2s ease-in-out infinite; }
  .joint .ember-glow { animation: emberpulse 2.2s ease-in-out infinite; }
  @keyframes emberpulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  #smoke {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .snack {
    position: absolute;
    left: var(--x);
    top: var(--y);
    font-size: var(--s);
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.6)) blur(var(--b, 0px));
    animation: float var(--d) ease-in-out infinite alternate;
    user-select: none;
  }
  @keyframes float {
    from { transform: translateY(-2.2vmin) rotate(-7deg); }
    to   { transform: translateY(2.2vmin) rotate(7deg); }
  }

  #screen-reward.active .eyebrow        { animation: rise 1s 0.2s ease both; }
  #screen-reward.active .reward-title   { animation: rise 1.2s 0.4s ease both, shimmer 7s ease-in-out infinite; }
  #screen-reward.active .reward-caption { animation: rise 1.2s 0.7s ease both; }
  #screen-reward.active .altar          { animation: rise 1.6s 0.9s ease both; }
  #screen-reward.active .again          { animation: rise 1.2s 1.6s ease both; }

  .again {
    background: transparent;
    border: 0;
    font-family: var(--caps);
    font-size: clamp(0.65rem, 1.3vmin, 0.9rem);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
    color: var(--whisper);
    cursor: pointer;
    padding: 1.2em;
    margin-bottom: 2vmin;
    transition: color 0.4s ease;
  }
  .again:hover, .again:focus-visible { color: var(--gold-bright); outline: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .screen { filter: none; }
  }
</style>
</head>

      <button>
        <span class="numeral">I.</span>
        <span class="text">Inject heroin every morning.</span>
        <span class="verdict">The mirror darkens. That is not youth — that is vanishing.</span>
      </button>
    </li>
    <li class="answer" data-key="2">
      <button>
        <span class="numeral">II.</span>
        <span class="text">Fast for three weeks every three weeks.</span>
        <span class="verdict">Hunger does not stop time. It only makes it feel longer.</span>
      </button>
    </li>
    <li class="answer" data-key="3">
      <button>
        <span class="numeral">III.</span>
        <span class="text">Smoke weed, enjoy life, and eat snacks.</span>
        <span class="verdict"></span>
      </button>
    </li>
    <li class="answer" data-key="4">
      <button>
        <span class="numeral">IV.</span>
        <span class="text">Die young.</span>
        <span class="verdict">Technically flawless. The mirror remains unimpressed.</span>
      </button>
    </li>
    <li class="answer" data-key="5">
      <button>
        <span class="numeral">V.</span>
        <span class="text">Dance without ever stopping.</span>
        <span class="verdict">Even the eternal dancer’s knees belong to time.</span>
      </button>
    </li>
  </ol>
</section>

<!-- SCREEN 3 -->
<section class="screen" id="screen-reward">
  <p class="eyebrow">The Mirror Approves</p>
  <h2 class="reward-title">Forever Young.</h2>
  <p class="reward-caption">Smoke weed, enjoy life, and eat snacks.</p>

  <div class="altar">
    <span class="snack" style="--x:6%;  --y:12%; --s:5.5vmin; --d:5s;">🍟</span>
    <span class="snack" style="--x:86%; --y:8%;  --s:6.5vmin; --d:6.4s;">🍿</span>
    <span class="snack" style="--x:12%; --y:68%; --s:7vmin;   --d:5.6s;">🍫</span>
    <span class="snack" style="--x:82%; --y:62%; --s:6vmin;   --d:7.2s;">🍩</span>
    <span class="snack" style="--x:44%; --y:2%;  --s:4.5vmin; --d:6s;   --b:1.5px;">🥨</span>
    <span class="snack" style="--x:28%; --y:86%; --s:5vmin;   --d:6.8s;">🍪</span>
    <span class="snack" style="--x:66%; --y:88%; --s:4.5vmin; --d:5.2s; --b:1px;">🧀</span>
    <span class="snack" style="--x:-2%; --y:40%; --s:4vmin;   --d:7.6s; --b:2px;">🥔</span>
    <span class="snack" style="--x:94%; --y:36%; --s:4vmin;   --d:6.2s; --b:2px;">🍭</span>

    <svg class="joint" viewBox="0 0 640 200" aria-label="A very large joint">
      <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6f0e2"/>
          <stop offset="0.5" stop-color="#e7dfcc"/>
          <stop offset="1" stop-color="#c9bfa6"/>
        </linearGradient>
        <radialGradient id="emberG" cx="0.35" cy="0.5" r="0.75">
          <stop offset="0" stop-color="#fff3c0"/>
          <stop offset="0.35" stop-color="#ffb347"/>
          <stop offset="0.75" stop-color="#e2572b"/>
          <stop offset="1" stop-color="#7a1f0e"/>
        </radialGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
      </defs>

      <!-- ember halo -->
      <ellipse class="ember-glow" cx="80" cy="96" rx="52" ry="40" fill="#ff8c3a" opacity="0.8" filter="url(#glow)"/>

      <!-- paper body: fat lit end (left) tapering to twisted tip (right) -->
      <path d="M 78 62 C 200 48, 400 58, 560 82
               L 560 118 C 400 142, 200 152, 78 134 Z"
            fill="url(#paper)"/>
      <!-- seam lines -->
      <path d="M 140 60 C 170 85, 165 115, 138 140" fill="none" stroke="#b3a88c" stroke-width="1.6" opacity="0.8"/>
      <path d="M 250 56 C 285 82, 282 118, 248 146" fill="none" stroke="#b3a88c" stroke-width="1.4" opacity="0.7"/>
      <path d="M 360 60 C 392 82, 390 114, 358 138" fill="none" stroke="#b3a88c" stroke-width="1.2" opacity="0.6"/>
      <path d="M 465 68 C 492 85, 490 110, 462 128" fill="none" stroke="#b3a88c" stroke-width="1" opacity="0.5"/>

      <!-- burnt rim -->
      <path d="M 78 62 C 96 84, 96 112, 78 134 C 62 116, 62 82, 78 62 Z" fill="#3a3230"/>
      <!-- ember -->
      <ellipse class="ember-core" id="ember" cx="74" cy="98" rx="17" ry="34" fill="url(#emberG)"/>

      <!-- twisted tip -->
      <path d="M 560 82 C 588 84, 600 92, 618 96 C 600 102, 588 112, 560 118
               C 566 106, 566 94, 560 82 Z" fill="#d8cfb6"/>
      <path d="M 566 88 L 606 95 M 566 112 L 606 99" stroke="#a89d80" stroke-width="1.4" fill="none"/>
    </svg>

    <canvas id="smoke"></canvas>
  </div>

  <button class="again" id="btn-again">Begin again</button>
</section>

<div class="flash" id="flash"></div>

<script>
(function () {
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ----- clock ticks ----- */
  function ticks(groupId, r1, r2, n) {
    var g = document.getElementById(groupId);
    var parts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      var big = i % (n / 12) === 0;
      var rA = big ? r1 - 14 : r1;
      parts.push('<line x1="' + (500 + Math.cos(a) * rA).toFixed(1) +
        '" y1="' + (500 + Math.sin(a) * rA).toFixed(1) +
        '" x2="' + (500 + Math.cos(a) * r2).toFixed(1) +
        '" y2="' + (500 + Math.sin(a) * r2).toFixed(1) +
        '" stroke="#D3A95C" stroke-width="' + (big ? 2 : 0.8) + '"/>');
    }
    g.innerHTML = parts.join("");
  }
  ticks("ticks-outer", 452, 480, 60);
  ticks("ticks-inner", 312, 330, 48);

  /* ----- gold dust ----- */
  var dust = document.getElementById("dust");
  var dctx = dust.getContext("2d");
  var motes = [];
  function sizeDust() {
    dust.width = innerWidth * devicePixelRatio;
    dust.height = innerHeight * devicePixelRatio;
    dctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  sizeDust();
  addEventListener("resize", sizeDust);
  for (var i = 0; i < 70; i++) {
    motes.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: 0.5 + Math.random() * 1.6,
      vx: (Math.random() - 0.5) * 0.12,
      vy: -0.05 - Math.random() * 0.22,
      p: Math.random() * Math.PI * 2
    });
  }
  function drawDust(t) {
    dctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.x += m.vx; m.y += m.vy;
      if (m.y < -5) { m.y = innerHeight + 5; m.x = Math.random() * innerWidth; }
      if (m.x < -5) m.x = innerWidth + 5;
      if (m.x > innerWidth + 5) m.x = -5;
      var tw = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t / 900 + m.p));
      dctx.beginPath();
      dctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      dctx.fillStyle = "rgba(211,169,92," + tw.toFixed(3) + ")";
      dctx.fill();
    }
  }

  /* ----- smoke ----- */
  var smoke = document.getElementById("smoke");
  var sctx = smoke.getContext("2d");
  var puffs = [];
  var rewardActive = false;
  function sizeSmoke() {
    /* offsetWidth/Height ignore the screen's scale transition */
    smoke.width = smoke.parentElement.offsetWidth * devicePixelRatio;
    smoke.height = smoke.parentElement.offsetHeight * devicePixelRatio;
    sctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  function emberPos() {
    var box = smoke.parentElement.getBoundingClientRect();
    var e = document.getElementById("ember").getBoundingClientRect();
    return { x: e.left + e.width / 2 - box.left, y: e.top + e.height / 2 - box.top };
  }
  function drawSmoke(t) {
    sctx.clearRect(0, 0, smoke.parentElement.offsetWidth, smoke.parentElement.offsetHeight);
    if (rewardActive && puffs.length < 90 && Math.random() < 0.45) {
      var p0 = emberPos();
      puffs.push({
        x: p0.x + (Math.random() - 0.5) * 8,
        y: p0.y,
        r: 4 + Math.random() * 7,
        vy: 0.5 + Math.random() * 0.7,
        drift: 10 + Math.random() * 26,
        p: Math.random() * Math.PI * 2,
        life: 0,
        max: 240 + Math.random() * 120
      });
    }
    for (var i = puffs.length - 1; i >= 0; i--) {
      var s = puffs[i];
      s.life++;
      if (s.life > s.max) { puffs.splice(i, 1); continue; }
      var k = s.life / s.max;
      var x = s.x + Math.sin(s.life / 38 + s.p) * s.drift * k;
      var y = s.y - s.vy * s.life;
      var r = s.r + k * 34;
      var a = 0.16 * (1 - k) * Math.min(1, s.life / 30);
      var g = sctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(205,196,226," + a.toFixed(3) + ")");
      g.addColorStop(1, "rgba(205,196,226,0)");
      sctx.beginPath();
      sctx.arc(x, y, r, 0, Math.PI * 2);
      sctx.fillStyle = g;
      sctx.fill();
    }
  }

  if (!reduced) {
    var lastTick = 0;
    var step = function (t) {
      lastTick = performance.now();
      drawDust(t);
      drawSmoke(t);
    };
    (function loop(t) {
      step(t || 0);
      requestAnimationFrame(loop);
    })(0);
    /* keep drawing even where rAF is throttled (embedded webviews, previews) */
    setInterval(function () {
      if (performance.now() - lastTick > 400) step(performance.now());
    }, 66);
  } else {
    drawDust(0);
  }

  /* ----- clock tick sound ----- */
  var actx = null;
  var tickTimer = null;
  var noiseBuf = null;
  var tock = false;
  function tickOnce() {
    if (document.hidden) return; /* stay silent when the tab is in the background */
    if (!actx || actx.state !== "running" || !noiseBuf) return;
    tock = !tock;
    var t = actx.currentTime;

    /* delicate mechanical click: a soft, thin burst of filtered noise */
    var src = actx.createBufferSource();
    src.buffer = noiseBuf;
    var hp = actx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 2000;
    var bp = actx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = tock ? 4300 : 5400;
    bp.Q.value = 2.2;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.02);
    src.connect(hp);
    hp.connect(bp);
    bp.connect(g);
    g.connect(actx.destination);
    src.start(t);
    src.stop(t + 0.04);

    /* faint low body so it doesn't sound like pure static */
    var osc = actx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(tock ? 150 : 185, t);
    var g2 = actx.createGain();
    g2.gain.setValueAtTime(0.035, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
    osc.connect(g2);
    g2.connect(actx.destination);
    osc.start(t);
    osc.stop(t + 0.05);
  }
  var audioUnlocked = false;
  function startTicking() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return; }
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 0.05), actx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (actx.state === "suspended") actx.resume();
    /* iOS WebKit: audio must actually PLAY inside the first touch event —
       fire a one-sample silent buffer synchronously; retry until running */
    if (!audioUnlocked) {
      try {
        var ub = actx.createBuffer(1, 1, 22050);
        var us = actx.createBufferSource();
        us.buffer = ub;
        us.connect(actx.destination);
        us.start(0);
      } catch (e) {}
      if (actx.state === "running") audioUnlocked = true;
    }
  }
  /* the hand steps 6° on the same timer as the sound, so they never drift */
  var hand = document.querySelector(".clockring .hand");
  var handAngle = 0;
  tickTimer = setInterval(function () {
    handAngle = (handAngle + 6) % 360;
    hand.style.transform = "rotate(" + handAngle + "deg)";
    tickOnce();
  }, 1000);
  /* iOS WebKit blocks speech that starts outside a touch event (ours starts
     on a timer) — speak a silent utterance inside the first gesture to unlock */
  var speechUnlocked = false;
  function unlockSpeech() {
    if (speechUnlocked || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    speechUnlocked = true;
    try {
      speechSynthesis.resume();
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  /* browsers refuse audio until the first user gesture — grab the earliest
     one possible, and keep retrying so ticking starts on the title screen */
  startTicking();
  ["pointerdown", "pointerup", "touchstart", "touchend", "keydown", "click"]
    .forEach(function (ev) {
      addEventListener(ev, function () { startTicking(); unlockSpeech(); }, true);
    });
  setInterval(function () {
    if (actx && actx.state === "suspended") actx.resume();
  }, 500);

  /* ----- screens ----- */
  var screens = {
    title: document.getElementById("screen-title"),
    question: document.getElementById("screen-question"),
    reward: document.getElementById("screen-reward")
  };
  function goTo(name) {
    for (var k in screens) screens[k].classList.toggle("active", k === name);
    rewardActive = name === "reward";
    if (rewardActive) { sizeSmoke(); puffs.length = 0; }
  }
  addEventListener("resize", function () { if (rewardActive) sizeSmoke(); });

  /* ----- voice: read the question, then reveal + read answers one by one ----- */
  var answerItems = Array.prototype.slice.call(document.querySelectorAll(".answer"));
  var seqToken = 0;
  if (window.speechSynthesis) speechSynthesis.getVoices(); /* warm async voice list */
  function stopSequence() {
    seqToken++;
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
  }
  function speak(text, cb) {
    var done = false;
    function finish() { if (!done) { done = true; if (cb) cb(); } }
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
      setTimeout(finish, 1200); /* no TTS available: keep the paced reveal */
      return;
    }
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    var voices = speechSynthesis.getVoices();
    var isEn = function (v) { return /^en[-_]/i.test(v.lang); };
    var preferred = /Google (US|UK) English|Samantha|Daniel|Alex\b|Karen|Moira|Tessa|Aria|Zira|Jenny/i;
    var pick = null;
    for (var i = 0; i < voices.length && !pick; i++) {
      if (isEn(voices[i]) && preferred.test(voices[i].name)) pick = voices[i];
    }
    for (var j = 0; j < voices.length && !pick; j++) {
      if (isEn(voices[j]) && voices[j].default) pick = voices[j];
    }
    if (pick) u.voice = pick;
    u.rate = 0.92;
    u.pitch = 0.8;
    u.onend = finish;
    u.onerror = finish;
    try { speechSynthesis.resume(); } catch (e) {} /* iOS sometimes leaves it paused */
    speechSynthesis.speak(u);
    setTimeout(finish, 1500 + text.length * 110); /* safety if onend never fires */
  }
  var spokenNumbers = ["One", "Two", "Three", "Four", "Five"];
  function revealAnswer(i, token) {
    if (token !== seqToken || i >= answerItems.length) return;
    answerItems[i].classList.add("revealed");
    var text = answerItems[i].querySelector(".text").textContent;
    speak(spokenNumbers[i] + ". " + text, function () {
      setTimeout(function () { revealAnswer(i + 1, token); }, 300);
    });
  }
  function runQuestionSequence() {
    stopSequence();
    var token = seqToken;
    answerItems.forEach(function (li) { li.classList.remove("revealed"); });
    setTimeout(function () {
      if (token !== seqToken) return;
      speak("What is the best way to defeat old age?", function () {
        setTimeout(function () { revealAnswer(0, token); }, 400);
      });
    }, 1200); /* let the screen transition and question entrance land first */
  }

  document.getElementById("btn-next").addEventListener("click", function () {
    goTo("question");
    runQuestionSequence();
  });

  var flash = document.getElementById("flash");
  document.querySelectorAll(".answer").forEach(function (li) {
    li.querySelector("button").addEventListener("click", function () {
      if (li.classList.contains("wrong") || li.classList.contains("chosen")) return;
      if (li.dataset.key === "3") {
        stopSequence(); /* silence the narrator on the winning pick */
        li.classList.add("chosen");
        flash.classList.remove("go");
        void flash.offsetWidth;
        flash.classList.add("go");
        setTimeout(function () { goTo("reward"); }, reduced ? 0 : 620);
      } else {
        li.classList.add("shake");
        setTimeout(function () {
          li.classList.remove("shake");
          li.classList.add("wrong");
        }, reduced ? 0 : 480);
      }
    });
  });

  document.getElementById("btn-again").addEventListener("click", function () {
    stopSequence();
    document.querySelectorAll(".answer").forEach(function (li) {
      li.classList.remove("wrong", "chosen", "shake", "revealed");
    });
    goTo("title");
  });
})();
</script>
